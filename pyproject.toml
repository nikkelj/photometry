[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photometry"
version = "0.1.0"
description = "Constellation-aggregated star tracker photometry: simulation and attitude/shape inversion"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photometry = ["catalog/data/*"]
